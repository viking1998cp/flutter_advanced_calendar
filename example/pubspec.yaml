description: Demonstrates how to use the flutter_advanced_calendar plugin.

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_advanced_calendar:
    path: ../
  flutter_localization: ^0.3.3
  flutter_screenutil: ^5.9.0

flutter:
  uses-material-design: true
